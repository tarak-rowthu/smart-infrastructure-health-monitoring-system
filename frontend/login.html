<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IoT Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card glass-panel">
        <div class="login-brand-icon">
            <i class="ph ph-cpu"></i>
        </div>
        <h1 class="login-title">IoT Systems</h1>
        <p class="login-subtitle">Infrastructure Health Monitoring</p>
        
        <div id="login-error" class="error-message"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" class="input-field" required placeholder="name@campus.edu">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn btn-block" style="margin-top: 2rem;">
                Sign In <i class="ph ph-arrow-right"></i>
            </button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #94a3b8;">
            Don't have an account? <a href="register.html" style="color: #4facfe; text-decoration: none; font-weight: 500;">Register here</a>
        </p>
    </div>

    <script src="js/background.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildings - IoT Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-brand">
                <i class="ph ph-cpu brand-icon"></i>
                <span class="brand-text">Infrastructure Monitoring</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="ph ph-squares-four"></i> <span>Dashboard</span></a></li>
                <li><a href="sensors.html"><i class="ph ph-broadcast"></i> <span>Sensors</span></a></li>
                <li><a href="buildings.html" class="active"><i class="ph ph-buildings"></i> <span>Buildings</span></a></li>
                <li><a href="alerts.html"><i class="ph ph-warning-circle"></i> <span>Alerts</span></a></li>
                <li><a href="data.html"><i class="ph ph-database"></i> <span>Data Logs</span></a></li>
            </ul>
            <div class="logout-container">
                <a href="#" onclick="logout()" class="btn btn-block logout-btn"
                    style="background: none; border: 1px solid var(--danger-bg);"><i class="ph ph-sign-out"></i>
                    Logout</a>
            </div>
        </nav>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header -->
            <header class="top-header">
                <div class="user-profile">
                    <div class="user-info" style="text-align: right;">
                        <span class="user-name" id="header-user-name">Loading...</span>
                        <span class="user-role" id="header-user-role">...</span>
                    </div>
                    <div class="user-avatar" id="header-user-avatar">?</div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <div class="flex-between" style="margin-bottom: 2rem;">
                    <div>
                        <h1 class="page-title">Campus Buildings</h1>
                        <p class="page-subtitle">Select an infrastructure node to view internal room telemetry</p>
                    </div>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-muted); font-size: 0.9rem;">
                            <input type="checkbox" id="admin-mode-toggle" style="accent-color: var(--primary); width: 16px; height: 16px;">
                            <span>Admin Mode</span>
                        </label>
                        <button class="btn" id="add-building-btn" style="display: none; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; box-shadow: 0 0 15px rgba(59,130,246,0.3);">
                            <i class="ph ph-plus-circle"></i> Add Building
                        </button>
                    </div>
                </div>

                <!-- Buildings Grid -->
                <div class="dashboard-grid" id="buildings-grid">
                    <!-- Populated by JS -->
                </div>

                <!-- Add Building Modal -->
                <div id="add-building-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); z-index: 1000; align-items: center; justify-content: center;">
                    <div class="glass-panel" style="padding: 2rem; border-radius: 20px; width: 420px; max-width: 90%; border: 1px solid rgba(255,255,255,0.12);">
                        <h2 style="margin-bottom: 0.5rem; font-size: 1.4rem;">Add New Building</h2>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Fill in the details for the new infrastructure node.</p>
                        <form id="add-building-form">
                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Building Name *</label>
                                <input type="text" id="b-name" required placeholder="e.g. Main Block" style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; outline: none; box-sizing: border-box;">
                            </div>
                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Location *</label>
                                <input type="text" id="b-location" required placeholder="e.g. North Campus" style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; outline: none; box-sizing: border-box;">
                            </div>
                            <div style="margin-bottom: 1.5rem;">
                                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Type *</label>
                                <input type="text" id="b-type" required placeholder="e.g. Classroom, Office, Lab" style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; outline: none; box-sizing: border-box;">
                            </div>
                            <div id="form-error" style="color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
                            <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                                <button type="button" id="cancel-building-btn" class="btn" style="background: none; border: 1px solid var(--border); color: var(--text-muted);">Cancel</button>
                                <button type="submit" class="btn btn-glossy" id="save-building-btn" style="background: linear-gradient(135deg, #22c55e, #16a34a); border: none; color: white; box-shadow: 0 0 15px rgba(34,197,94,0.3);">
                                    <i class="ph ph-floppy-disk"></i> Save Building
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function viewRooms(id) {
            window.location.href = `rooms.html?building_id=${id}`;
        }

        // Admin Mode Toggle
        const adminToggle = document.getElementById('admin-mode-toggle');
        const addBtn = document.getElementById('add-building-btn');
        const modal = document.getElementById('add-building-modal');
        const cancelBtn = document.getElementById('cancel-building-btn');
        const form = document.getElementById('add-building-form');
        const formError = document.getElementById('form-error');

        adminToggle.addEventListener('change', () => {
            const isAdmin = adminToggle.checked;
            addBtn.style.display = isAdmin ? 'flex' : 'none';
            // Show/hide delete buttons on all cards
            document.querySelectorAll('.delete-building-btn').forEach(b => {
                b.style.display = isAdmin ? 'flex' : 'none';
            });
        });

        addBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        cancelBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            form.reset();
            formError.style.display = 'none';
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                form.reset();
                formError.style.display = 'none';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('b-name').value.trim();
            const location = document.getElementById('b-location').value.trim();
            const type = document.getElementById('b-type').value.trim();
            const saveBtn = document.getElementById('save-building-btn');

            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;

            try {
                const res = await fetch('https://smart-infrastructure-health-monitoring.onrender.com/api/buildings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location, type })
                });
                const result = await res.json();
                if (result.success) {
                    modal.style.display = 'none';
                    form.reset();
                    // Reload buildings
                    if (typeof renderBuildings === 'function') renderBuildings();
                } else {
                    formError.textContent = result.message || 'Failed to add building.';
                    formError.style.display = 'block';
                }
            } catch (err) {
                formError.textContent = 'Cannot reach backend server. Is it running?';
                formError.style.display = 'block';
            } finally {
                saveBtn.textContent = 'Save Building';
                saveBtn.disabled = false;
            }
        });

        window.deleteBuilding = async (id) => {
            if (!confirm('Are you sure you want to permanently delete this building and all its rooms and sensors?')) return;
            try {
                const res = await fetch(`https://smart-infrastructure-health-monitoring.onrender.com/api/buildings/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.success) {
                    if (typeof renderBuildings === 'function') renderBuildings();
                } else {
                    alert('Failed to delete: ' + result.message);
                }
            } catch (err) {
                alert('Cannot reach backend server.');
            }
        };
    </script>
    <script src="js/background.js"></script>
    <script src="js/api.js?v=15"></script>
    <script src="js/app.js?v=15"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - IoT Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card glass-panel">
        <div class="login-brand-icon">
            <i class="ph ph-user-plus"></i>
        </div>
        <h1 class="login-title">Join IoT Systems</h1>
        <p class="login-subtitle">Infrastructure Health Monitoring</p>
        
        <div id="message" class="error-message"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="input-field" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" class="input-field" required placeholder="name@campus.edu">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" required placeholder="Min 6 characters" minlength="6">
            </div>
            
            <button type="submit" class="btn btn-block" style="margin-top: 2rem;">
                Create Account <i class="ph ph-rocket"></i>
            </button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #94a3b8;">
            Already have an account? <a href="login.html" style="color: #4facfe; text-decoration: none; font-weight: 500;">Sign in here</a>
        </p>
    </div>

    <script src="js/background.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
